<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Permiso de TikTok · Móntatelo</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{--bg:#F2EBDD;--card:#FBF7EF;--line:#E0D3BA;--tx:#1E2A22;--tx3:#7F887F;--g:#1F4D36;--g2:#2F6B4A}
@media (prefers-color-scheme:dark){:root{--bg:#0F2219;--card:#16301F;--line:#2A4A35;--tx:#F3EBDD;--tx3:#9DAA9F;--g:#8FD3A7;--g2:#6FBF8E;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:32px 16px}
h1{font-family:Georgia,serif;color:var(--g);font-size:26px;margin:0 0 12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;word-break:break-all;font-family:ui-monospace,monospace;font-size:14px}
button{margin-top:12px;background:var(--g2);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}
p{color:var(--tx3)}
a{color:var(--g2);font-weight:700}
</style>
</head>
<body>
<div class="w">
<h1>Permiso de TikTok</h1>
<div id="r"></div>
<p><a href="/">← Volver a Móntatelo</a></p>
</div>
<script>
(function(){var q=new URLSearchParams(location.search),c=q.get('code'),e=q.get('error'),r=document.getElementById('r');
if(c){r.innerHTML='<p>Copia este código y pégalo en GitHub, en la acción «Permiso TikTok» (caduca en unos minutos):</p><div class="c" id="k"></div><button id="b">Copiar código</button>';
document.getElementById('k').textContent=c;document.getElementById('b').onclick=function(){try{navigator.clipboard.writeText(c);this.textContent='Copiado ✓'}catch(x){}}}
else if(e){r.innerHTML='<p>TikTok no ha dado el permiso:</p><div class="c"></div>';r.querySelector('.c').textContent=e+' '+(q.get('error_description')||'')}
else{r.innerHTML='<p>Esta página solo sirve para el robot de vídeos de Móntatelo.</p>'}})();
</script>
</body>
</html>
